<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão · Controle Financeiro</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 26rem;
            margin: 1.5rem;
            padding: 2.5rem 2rem;
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .icon {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.25rem;
            border-radius: 9999px;
            background: #d1fae5;
            color: #047857;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.25rem;
            color: #1f2937;
        }
        p {
            margin: 0 0 1.5rem;
            color: #6b7280;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        button {
            border: none;
            background: #059669;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
        }
        button:hover {
            background: #047857;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#8635;</div>
        <h1>Você está offline</h1>
        <p>
            Não foi possível carregar esta página porque não há conexão com a internet
            e nenhuma versão em cache está disponível. Dados já visitados de
            transações, categorias e limites continuam acessíveis offline.
        </p>
        <button onclick="location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
